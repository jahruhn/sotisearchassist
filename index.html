<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOTI Knowledge Base search engine</title>
  <style>
    body {
      font-family: 'Salesforce Sans', Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .search-container {
      border: 1px solid #0099D3;
      border-radius: 8px;
      background-color: #ffffff;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h3 {
      color: #0099D3;
    }
    input[type="text"] {
      width: 80%;
      padding: 8px;
      margin-right: 10px;
    }
    input[type="submit"] {
      padding: 8px 16px;
      background-color: #0099D3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #007bb5;
    }
    .instructions {
      font-size: 12px;
      margin-top: 15px;
    }
    .instructions a {
      color: #0099D3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <h3>🔍 SOTI Knowledge Base Search Engine</h3>
    <form method="get" action="https://duckduckgo.com/" target="_blank">
      <input type="text" name="q" placeholder="Search SOTI topics, e.g. 'MobiControl upgrade steps'" />
      <input type="hidden" name="sites" value="pulse.soti.net,soti.net OR site:youtube.com/@SOTI_inc OR site:linkedin.com/company/soti OR site:wiki.soti.net" />
      <input type="hidden" name="kl" value="uk-en" />
      <input type="hidden" name="kac" value="1" />
      <input type="hidden" name="kn" value="1" />
      <input type="hidden" name="kg" value="g" />
      <input type="hidden" name="kz" value="1" />
      <input type="hidden" name="kp" value="-1" />
      <input type="hidden" name="kc" value="1" />
      <input type="hidden" name="kav" value="1" />
      <input type="submit" value="Search" />
    </form>
    <div class="instructions">
      💡 <strong>Tip:</strong> Ask technical questions like “How do I reset a device in MobiControl?”<br>
      🧠 Search Assist will summarize answers using AI from 
      <a href="https://wiki.soti.net" target="_blank">wiki.soti.net</a>, 
      <a href="https://pulse.soti.net" target="_blank">pulse.soti.net</a>, 
      <a href="https://soti.net" target="_blank">soti.net</a>, 
      <a href="https://www.youtube.com/@SOTI_inc/videos" target="_blank">SOTI YouTube</a>, and 
      <a href="https://www.linkedin.com/company/soti/posts/?feedView=all" target="_blank">SOTI LinkedIn</a>.
    </div>
  </div>
</body>
</html>
